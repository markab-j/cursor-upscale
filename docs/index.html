<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>Cursor Upscale</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link id="webfont" rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Cursor Upscale</h1>
      <div class="header-actions">
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">
          <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
        <div class="language-picker" id="language-picker">
          <button class="icon-button" id="language-toggle" type="button" aria-label="Language" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
          </button>
          <div class="language-menu" id="language-menu" role="menu" aria-labelledby="language-toggle" hidden>
            <button type="button" role="menuitemradio" data-language="ko" aria-checked="false" lang="ko">한국어</button>
            <button type="button" role="menuitemradio" data-language="en" aria-checked="true" lang="en">English</button>
            <button type="button" role="menuitemradio" data-language="ja" aria-checked="false" lang="ja">日本語</button>
            <button type="button" role="menuitemradio" data-language="zh" aria-checked="false" lang="zh-CN">简体中文</button>
          </div>
        </div>
      </div>
    </header>
    <main class="workspace">
      <section class="input-panel" aria-label="Input">
        <fieldset class="scale-settings" id="settings">
          <label for="scale" data-i18n="scale">Scale</label>
          <div class="number-field"><input id="scale" type="number" min="2" step="1" value="2" inputmode="numeric"><span aria-hidden="true">×</span></div>
        </fieldset>
        <div class="drop-area" id="drop">
          <button class="drop-target" id="choose-files" type="button">
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21V6m-6 6 6-6 6 6M7 20v5a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg>
            </span>
            <span class="drop-label" id="selection-name" data-i18n="drop">Drop files</span>
            <span class="selection-count" id="selection-count">CUR · ANI</span>
            <span class="selection-types" id="selection-types"></span>
          </button>
          <button class="folder-button" id="choose-folder" type="button" data-i18n="chooseFolder">Choose folder</button>
          <input id="files" type="file" accept=".cur,.ani,.inf" multiple hidden>
          <input id="folder" type="file" webkitdirectory multiple hidden>
        </div>
        <div class="file-feedback" id="file-feedback" aria-live="polite">
          <div class="feedback-counts"><span class="eligible" id="eligible"></span><span class="ineligible" id="ineligible"></span></div>
          <div class="size-preview" id="size-preview"></div>
        </div>
        <p class="rejection" id="rejection" role="status" aria-live="polite"></p>
      </section>
      <div class="convert-panel">
        <button class="convert-button" id="convert" type="button" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16m-6-6 6 6-6 6"/></svg>
          <span data-i18n="convert">Convert</span>
        </button>
      </div>
      <section class="output-panel" aria-labelledby="terminal-title">
        <div class="output-toolbar">
          <h2 id="terminal-title" data-i18n="terminal">Terminal</h2>
          <button class="download" id="download" type="button" disabled>
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9m-3-3 3 3 3-3M4 13v3h12v-3"/></svg>
            <span data-i18n="download">Download</span>
          </button>
        </div>
        <div class="terminal" id="terminal" data-state="ready">
          <div class="terminal-chrome"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>cursor-upscale</span><span id="progress"></span></div>
          <div class="terminal-body" id="terminal-body" tabindex="0">
            <div class="command"><span class="prompt" aria-hidden="true">❯</span><span id="command">cursor-upscale --scale 2</span></div>
            <div class="terminal-log" id="log" role="log" aria-live="polite" aria-atomic="false"></div>
            <span class="caret" aria-hidden="true"></span>
          </div>
          <div class="terminal-footer"><span class="state-dot" aria-hidden="true"></span><span id="status" data-i18n="ready">Ready</span><span id="output-name"></span></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
